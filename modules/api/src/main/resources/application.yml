    manufacturing-cost: 5.0
    markup-min: 30.0
    markup-multiplier: 3.0
    tax-rate: 0.11
    discount-steps:
      1-9: 7.0
      10-49: 0.0
      50-199: -2.0
      200-499: -4.0
      500-699: -6.0
      700+: -8.0