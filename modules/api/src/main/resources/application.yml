spring:
  application:
    name: korobki-calculator

  datasource:
    url: jdbc:postgresql://localhost:5432/korobki
    username: postgres
    password: 4meonl
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:very_long_secret_key_for_jwt_at_least_256_bits}
  expiration: 28800000

