# Альфа живёт на машине технолога: слушаем только петлевой интерфейс, чтобы
# приложение не было видно всей локальной сети. Для стенда задать
# SERVER_ADDRESS=0.0.0.0 и открыть брандмауэр осознанно.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: korobki-calculator
  # Локальные креды и прочие личные настройки — в application-local.yml в корне
  # проекта (файл в .gitignore, в jar не попадает). Оба пути необязательные:
  # рабочий каталог зависит от способа запуска — из IDEA это модуль
  # modules/api, а из корня идёт `./gradlew bootRun`/`java -jar`.
  # Переменные окружения всё равно имеют приоритет над файлами.
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:../../application-local.yml
  datasource:
    # Пароля БД в репозитории нет: значение приходит из application-local.yml
    # или из переменной окружения DB_PASSWORD. Пустой дефолт специально —
    # приложение упадёт на подключении с явной ошибкой аутентификации,
    # а не подключится куда-то по угаданному паролю.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/korobki}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate выключен: пустая база без flyway_schema_history
    # должна падать, а не считаться «уже мигрированной» — иначе таблицы
    # останутся пустыми при молчаливом пропуске всех миграций.
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET:very_long_secret_key_for_jwt_at_least_256_bits}
  expiration: 28800000

app:
  pricing:
    manufacturing-cost: 5.0
    markup-min: 30.0
    markup-multiplier: 3.0
    tax-rate: 0.11
    discount-steps:
      "до 9": 7.0
      "10–49": 0.0
      "50–199": -2.0
      "200–499": -4.0
      "500–699": -6.0
      "700–1499": -8.0
      "от 1500": -10.0
    x3-coefficients:
      "до 9": 1.0
      "10–49": 1.0
      "50–199": 0.95
      "200–499": 0.90
      "500–699": 0.85
      "700–1499": 0.80
      "от 1500": 0.75
    knife-price-per-mm: 3.0
    knife-base-cost: 500.0
# Swagger в альфе выключен: это внутренний API одного технолога, а открытая
# документация подсказывает, какие ручки дергать (в том числе purge).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

